name: Publish E2EESA 1.0.0 source release
on:
  push:
    branches:
      - work/e2eesa-publish-release-20261109

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Galinsky-Labs/End-To-End-Everywhere-Security-Architecture-Standard'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and full release history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Verify exact source, version and archived release manifest
        env:
          E2EESA_SOURCE_COMMIT: "b137a3d1cb54900204ff13c7694ed00a50c00141"
          E2EESA_MANIFEST_DIGEST: "sha256:e0b0390cf6c7e36776b7c4d515742cdda68a0edbf35b7b0d53cb3f599d2becb5"
        run: |
          test "$(git show "$E2EESA_SOURCE_COMMIT:VERSION" | tr -d '\r\n')" = "1.0.0"
          git worktree add --detach "$RUNNER_TEMP/e2eesa-source" "$E2EESA_SOURCE_COMMIT"
          cd "$RUNNER_TEMP/e2eesa-source"
          python release/validate_1_0_engineering.py
          python scripts/validate_repo.py
          python - <<'PY'
          import json, os
          p=json.load(open("release/1.0.0-manifest.json", encoding="utf-8"))
          assert p["release_version"] == "1.0.0"
          assert p["external_review_status"] == "pending"
          assert p["external_certification"] == "not-claimed"
          assert p["tree_digest"] == os.environ["E2EESA_MANIFEST_DIGEST"]
          assert p["file_count"] == 789
          PY

      - name: Create signed-off annotated version tag and public release notes
        env:
          GH_TOKEN: ${{ github.token }}
          E2EESA_SOURCE_COMMIT: "b137a3d1cb54900204ff13c7694ed00a50c00141"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin refs/tags/1.0.0 | grep -q 'refs/tags/1.0.0'; then
            echo "Release tag 1.0.0 already exists; refusing to repoint an immutable version"
            exit 1
          fi
          git tag -a 1.0.0 "$E2EESA_SOURCE_COMMIT" -m "E2EESA 1.0.0 stable engineering standard; independent certification not claimed"
          git push origin refs/tags/1.0.0
          gh release create 1.0.0 "$RUNNER_TEMP/e2eesa-source/release/1.0.0-manifest.json" --verify-tag --title "E2EESA 1.0.0 — Stable Engineering Standard" --notes-file "$RUNNER_TEMP/e2eesa-source/release/1.0.0-RELEASE-NOTES.md"
